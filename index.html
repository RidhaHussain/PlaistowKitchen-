<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaistow Community Kitchen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Plaistow Community Kitchen</h1>
        <p>Helping our community, together.</p>
    </header>

    <main>
        <section id="home" class="screen">
            <h2>Welcome!</h2>
            <p>What would you like to do?</p>
            <button onclick="showBooking()">Book Shift</button>
            <button onclick="showStock()">Stock Cupboard</button>
            <button onclick="showRota()">Tonight's Rota</button>
        </section>

        <section id="booking" class="screen" hidden>
            <h2>Book a Shift</h2>
            <form id="bookingForm">
                <label for="volunteerName">Your name</label>
                <input type="text" id="volunteerName" required maxlength="60">

                <label for="shiftDate">Date</label>
                <input type="date" id="shiftDate" required>

                <label for="shiftTime">Choose a shift</label>
                <select id="shiftTime" required>
                    <option value="">Select a time</option>
                    <option value="9AM - 12PM">Shift A: 9 AM - 12 PM</option>
                    <option value="1PM - 5PM">Shift B: 1 PM - 5 PM</option>
                </select>

                <button type="submit">Confirm Booking</button>
            </form>
            <p id="bookingMessage" class="message" role="status"></p>
            <button class="secondary" onclick="showHome()">Back to Home</button>
        </section>

        <section id="stock" class="screen" hidden>
            <h2>Stock Cupboard</h2>
            <p>Add food items and keep quantities up to date.</p>

            <div id="stockList"></div>

            <div class="panel">
                <h3>Add New Food</h3>
                <form id="newFoodForm">
                    <label for="newFoodName">Food name</label>
                    <input type="text" id="newFoodName"
                           placeholder="e.g. Baked beans"
                           maxlength="60" required>

                    <label for="newFoodQuantity">Starting quantity</label>
                    <input type="number" id="newFoodQuantity"
                           min="0" step="1" value="1" required>

                    <button type="submit">Add Food Item</button>
                </form>
            </div>

            <p id="stockMessage" class="message" role="status"></p>
            <button class="secondary" onclick="showHome()">Back to Home</button>
        </section>

        <section id="rota" class="screen" hidden>
            <h2>Volunteer Rota</h2>
            <p>View the booked shifts for each day.</p>
            <div id="rotaList"></div>
            <button class="secondary" onclick="showHome()">Back to Home</button>
        </section>
    </main>

    <footer>
        <p>Plaistow Community Kitchen · Volunteer Portal</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
