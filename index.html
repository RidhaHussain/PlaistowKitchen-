
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaistow Community Kitchen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="home">
        <h1>Plaistow Community Kitchen</h1>
        <p>Welcome! What would you like to do?</p>

        <button onclick="showBooking()">Book Shift</button>
        <button onclick="showStock()">Stock Cupboard</button>
        <button onclick="showRota()">Tonight's Rota</button>
    </div>

    <div id="booking" style="display: none;">
        <h2>Book a Shift</h2>

        <form id="bookingForm">
            <label for="volunteerName">Name</label>
            <input type="text" id="volunteerName" required>

            <label for="shiftDate">Date</label>
            <input type="date" id="shiftDate" required>

            <label for="shiftTime">Time</label>
            <select id="shiftTime" required>
                <option value="">Choose a shift</option>
                <option value="9AM - 12PM">9AM - 12PM</option>
                <option value="1PM - 5PM">1PM - 5PM</option>
            </select>

            <button type="submit">Confirm Booking</button>
        </form>

        <p id="bookingMessage" role="status"></p>
        <button onclick="showHome()">Back to Home</button>
    </div>


<div id="stock" style="display: none;">
    <h2>Stock Cupboard</h2>
    <p>Check and update kitchen supplies.</p>

    <div class="stock-item">
        <h3>Rice</h3>
        <p>Quantity: <strong id="riceQuantity">5</strong></p>
        <button onclick="changeStock('rice', 1)">Add Stock</button>
        <button onclick="changeStock('rice', -1)">Remove Stock</button>
    </div>

    <div class="stock-item">
        <h3>Pasta</h3>
        <p>Quantity: <strong id="pastaQuantity">9</strong></p>
        <button onclick="changeStock('pasta', 1)">Add Stock</button>
        <button onclick="changeStock('pasta', -1)">Remove Stock</button>
    </div>

    <div class="stock-item">
        <h3>Tins of tomatoes</h3>
        <p>Quantity: <strong id="tomatoQuantity">11</strong></p>
        <button onclick="changeStock('tomato', 1)">Add Stock</button>
        <button onclick="changeStock('tomato', -1)">Remove Stock</button>
    </div>

    <p id="stockMessage" role="status"></p>
    <button onclick="showHome()">Back to Home</button>
</div>

    <div id="rota" style="display: none;">
        <h2>Tonight's Rota</h2>
        <p>Volunteer rota screen coming soon.</p>
        <button onclick="showHome()">Back to Home</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
